# 竹里集商城 · Cloudflare Workers 部署配置
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/

name = "zhuliji-store"
main = "worker/index.js"
compatibility_date = "2024-11-01"

# node:* 内置模块的兼容层（本地 node:sqlite 路径不会在 Workers 执行，
# 但需要该 flag 让打包器正常解析 node:fs / node:crypto 等导入）
compatibility_flags = ["nodejs_compat"]

# 静态资源与 HTML 由 Worker 直接返回，不需要 assets 绑定

[vars]
# 非敏感配置：直接写在仓库里
LIANLIAN_ENV = "production"
# 站点对外地址：支付回调地址（/api/lianlian/notify）与返回链接都基于它生成
# 必须是带 https 的正式域名，不要留空
LIANLIAN_SITE_URL = "https://shop.naturalbamboo.app"
ADMIN_NAME = "竹里集管理员"

# ---------------------------------------------------------------------------
# 自定义域名：shop.naturalbamboo.app
# 前提：naturalbamboo.app 这个 zone 已在同一个 Cloudflare 账号下
# custom_domain = true 时，Cloudflare 会自动创建 DNS 记录并签发证书，
# 不需要手动加 CNAME。首次部署后证书生效通常需要 1-3 分钟。
# ---------------------------------------------------------------------------
[[routes]]
pattern = "shop.naturalbamboo.app"
custom_domain = true

# ---------------------------------------------------------------------------
# D1 数据库绑定：Worker 通过 env.DB 访问
# 首次部署前执行：npm run cf:db:create
# 该命令会创建数据库并把返回的 database_id 写入下面（或手动填写）
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "zhuliji-db"
database_id = "277538bf-c013-4015-88a3-ecf8ff1766ce"
# 迁移目录（可选，本项目的建表由 Worker 首次请求时自动完成）
# migrations_dir = "migrations"
